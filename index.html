<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw an Airplane — CFI Training Aid</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sky: #0a1628; --sky-mid: #0d2347; --blue: #1565c0;
      --blue-light: #1e88e5; --accent: #ffc107; --accent-dim: #e6a800;
      --white: #f0f4ff; --gray: #8eacd0;
      --panel: rgba(255,255,255,0.06); --panel-border: rgba(255,255,255,0.12);
      --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    body { font-family:'Segoe UI',system-ui,sans-serif;
      background:linear-gradient(160deg,var(--sky) 0%,var(--sky-mid) 100%);
      color:var(--white); min-height:100vh;
      display:flex; flex-direction:column; align-items:center; padding:16px; gap:14px; }
    header { text-align:center; padding:6px 0 2px; }
    header h1 { font-size:clamp(1.1rem,3vw,1.7rem); font-weight:700; letter-spacing:.04em; color:var(--accent); }
    header p  { font-size:.78rem; color:var(--gray); margin-top:2px; letter-spacing:.06em; text-transform:uppercase; }

    /* plane selector */
    .plane-selector { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    .plane-btn {
      background:var(--panel); border:1px solid var(--panel-border); color:var(--gray);
      font-size:.78rem; font-weight:700; padding:8px 18px; border-radius:50px;
      cursor:pointer; transition:all .2s; letter-spacing:.04em; display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    .plane-btn .pname { font-size:.82rem; color:var(--white); }
    .plane-btn .ptag  { font-size:.68rem; }
    .plane-btn:hover { border-color:var(--blue-light); }
    .plane-btn.active { background:var(--blue-light); border-color:var(--blue-light); color:#fff; }
    .plane-btn.active .ptag { color:rgba(255,255,255,.8); }

    /* tabs */
    .tabs { display:flex; gap:6px; background:var(--panel); border:1px solid var(--panel-border); border-radius:50px; padding:4px; }
    .tab-btn { background:none; border:none; color:var(--gray); font-size:.8rem; font-weight:600;
      padding:6px 16px; border-radius:50px; cursor:pointer; transition:all .2s; letter-spacing:.04em; white-space:nowrap; }
    .tab-btn:hover { color:var(--white); }
    .tab-btn.active { background:var(--accent); color:#1a0f00; }

    /* panels */
    .panel { display:none; width:100%; max-width:920px; }
    .panel.active { display:flex; flex-direction:column; gap:12px; }

    /* tutorial */
    .step-header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .step-badge { background:var(--accent); color:#1a0f00; font-weight:800; font-size:.7rem;
      padding:4px 12px; border-radius:50px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
    .step-title { font-size:clamp(.95rem,2.5vw,1.25rem); font-weight:700; color:var(--white); }
    .step-nav { display:flex; gap:8px; margin-left:auto; }
    .nav-btn { background:var(--panel); border:1px solid var(--panel-border); color:var(--white);
      font-size:.8rem; font-weight:600; padding:7px 14px; border-radius:8px;
      cursor:pointer; transition:all .2s; }
    .nav-btn:hover:not(:disabled) { background:var(--blue-light); border-color:var(--blue-light); }
    .nav-btn:disabled { opacity:.3; cursor:not-allowed; }
    .nav-btn.primary { background:var(--blue-light); border-color:var(--blue-light); }
    .nav-btn.primary:hover { background:var(--blue); border-color:var(--blue); }

    .step-dots { display:flex; gap:6px; justify-content:center; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--panel-border); transition:all .3s; cursor:pointer; }
    .dot.done  { background:var(--blue-light); }
    .dot.active{ background:var(--accent); transform:scale(1.3); }

    .tutorial-body { display:grid; grid-template-columns:1fr; gap:12px; }
    @media(min-width:640px){ .tutorial-body{ grid-template-columns:1fr 1fr; } }
    .canvas-card { background:#fff; border-radius:var(--radius); overflow:hidden;
      box-shadow:var(--shadow); position:relative; aspect-ratio:16/10; }
    .canvas-card canvas { width:100%; height:100%; display:block; }

    .instructions-card { background:var(--panel); border:1px solid var(--panel-border);
      border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
    .instructions-card h3 { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700; }
    .instruction-list { list-style:none; display:flex; flex-direction:column; gap:7px; }
    .instruction-list li { display:flex; gap:9px; align-items:flex-start; font-size:.84rem; line-height:1.5; color:var(--white); }
    .instruction-list li::before { content:attr(data-num); background:var(--blue-light); color:#fff;
      font-size:.68rem; font-weight:700; width:19px; height:19px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
    .whiteboard-tip { background:rgba(255,193,7,.1); border:1px solid rgba(255,193,7,.3);
      border-radius:8px; padding:9px 13px; font-size:.78rem; color:var(--accent); line-height:1.5; }
    .whiteboard-tip strong { display:block; margin-bottom:2px; }
    .anim-btn { background:var(--accent); color:#1a0f00; border:none; border-radius:8px;
      font-size:.8rem; font-weight:700; padding:8px 14px; cursor:pointer; transition:all .2s;
      letter-spacing:.04em; align-self:flex-start; }
    .anim-btn:hover { background:var(--accent-dim); }

    /* practice */
    .practice-toolbar { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
    .tool-group { display:flex; gap:4px; background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; padding:4px; }
    .tool-btn { background:none; border:none; color:var(--gray); font-size:.76rem; font-weight:600;
      padding:5px 11px; border-radius:6px; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:5px; }
    .tool-btn:hover { color:var(--white); background:rgba(255,255,255,.08); }
    .tool-btn.active { background:var(--blue-light); color:#fff; }
    .tool-btn.danger:hover { background:rgba(255,80,80,.2); color:#ff6b6b; }
    .size-slider { accent-color:var(--accent); width:75px; }
    .color-swatch { width:24px; height:24px; border-radius:50%; border:3px solid transparent;
      cursor:pointer; transition:all .15s; flex-shrink:0; }
    .color-swatch.active { border-color:var(--white); transform:scale(1.15); }
    .practice-canvas-wrap { background:#fff; border-radius:var(--radius); overflow:hidden;
      box-shadow:var(--shadow); cursor:crosshair; position:relative; aspect-ratio:16/9; }
    .practice-canvas-wrap canvas { width:100%; height:100%; display:block; touch-action:none; }
    .ghost-overlay { position:absolute; inset:0; pointer-events:none; transition:opacity .4s; }
    .practice-hints { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:9px; }
    .hint-card { background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:9px 11px; font-size:.76rem; line-height:1.5; }
    .hint-card strong { color:var(--accent); display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }

    /* reference */
    .ref-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:13px; }
    .ref-card { background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius); overflow:hidden; }
    .ref-card canvas { width:100%; display:block; background:#fff; }
    .ref-card .ref-label { padding:9px 13px; font-size:.78rem; font-weight:600; color:var(--accent); letter-spacing:.04em; }
    .ref-card .ref-desc  { padding:0 13px 11px; font-size:.73rem; color:var(--gray); line-height:1.5; }
  </style>
</head>
<body>
<header>
  <h1>&#9992; Draw an Airplane</h1>
  <p>CFI Visual Aid Training Tool</p>
</header>

<div class="plane-selector">
  <button class="plane-btn active" data-plane="c172">
    <span class="pname">Cessna 172 Skyhawk</span>
    <span class="ptag">High-wing &bull; Single engine &bull; Strut-braced</span>
  </button>
  <button class="plane-btn" data-plane="pa28">
    <span class="pname">Piper PA-28 Cherokee</span>
    <span class="ptag">Low-wing &bull; Single engine &bull; No struts</span>
  </button>
  <button class="plane-btn" data-plane="pa44">
    <span class="pname">Piper PA-44 Seminole</span>
    <span class="ptag">Low-wing &bull; Twin engine &bull; T-tail</span>
  </button>
</div>

<nav class="tabs">
  <button class="tab-btn active" data-tab="tutorial">Step-by-Step</button>
  <button class="tab-btn" data-tab="practice">Practice Board</button>
  <button class="tab-btn" data-tab="reference">Quick Reference</button>
</nav>

<div id="tab-tutorial" class="panel active">
  <div class="step-header">
    <div class="step-badge" id="step-badge">Step 1</div>
    <div class="step-title" id="step-title"></div>
    <div class="step-nav">
      <button class="nav-btn" id="prev-btn" disabled>&#8592; Prev</button>
      <button class="nav-btn primary" id="next-btn">Next &#8594;</button>
    </div>
  </div>
  <div class="step-dots" id="step-dots"></div>
  <div class="tutorial-body">
    <div class="canvas-card"><canvas id="tutorial-canvas" width="640" height="400"></canvas></div>
    <div class="instructions-card">
      <h3>Whiteboard Instructions</h3>
      <ul class="instruction-list" id="instruction-list"></ul>
      <div class="whiteboard-tip" id="whiteboard-tip"></div>
      <button class="anim-btn" id="replay-btn">&#9654; Replay Animation</button>
    </div>
  </div>
</div>

<div id="tab-practice" class="panel">
  <div class="practice-toolbar">
    <div class="tool-group">
      <button class="tool-btn active" id="tool-pen">&#9998; Draw</button>
      <button class="tool-btn" id="tool-eraser">&#9746; Erase</button>
    </div>
    <div class="tool-group">
      <span style="font-size:.73rem;color:var(--gray);padding:0 5px;align-self:center">Size</span>
      <input type="range" class="size-slider" id="brush-size" min="1" max="20" value="3">
    </div>
    <div class="tool-group" style="gap:5px;padding:5px 9px;">
      <div class="color-swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></div>
      <div class="color-swatch" data-color="#1565c0" style="background:#1565c0"></div>
      <div class="color-swatch" data-color="#c62828" style="background:#c62828"></div>
      <div class="color-swatch" data-color="#2e7d32" style="background:#2e7d32"></div>
      <div class="color-swatch" data-color="#e65100" style="background:#e65100"></div>
    </div>
    <div class="tool-group" style="margin-left:auto">
      <button class="tool-btn" id="toggle-ghost">&#9673; Ghost</button>
      <button class="tool-btn danger" id="clear-canvas">&#128465; Clear</button>
    </div>
  </div>
  <div class="practice-canvas-wrap" id="practice-wrap">
    <canvas id="practice-canvas" width="1280" height="720"></canvas>
    <canvas id="ghost-canvas" class="ghost-overlay" width="1280" height="720" style="opacity:.15"></canvas>
  </div>
  <div class="practice-hints" id="practice-hints"></div>
</div>

<div id="tab-reference" class="panel">
  <div class="ref-grid" id="ref-grid"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   COORDINATE HELPERS
   Design space: 640×400. Scale to any canvas.
═══════════════════════════════════════════════════ */
function makeS(cw, ch) {
  return { x: v => v * cw / 640, y: v => v * ch / 400 };
}

/* ═══════════════════════════════════════════════════
   CESSNA 172 SKYHAWK  (nose → right)
   High wing, strut-braced, single prop, fixed trike gear
═══════════════════════════════════════════════════ */
const C172 = {
  name: "Cessna 172 Skyhawk",
  hints: [
    { title:"High Wing", text:"Wing sits ON TOP of the fuselage — makes the 172 instantly recognizable." },
    { title:"Wing Struts", text:"A diagonal brace runs from the wing down to the lower fuselage on each side." },
    { title:"Round Cowling", text:"The nose is a big dome — wider than the fuselage behind it." },
    { title:"Greenhouse Cabin", text:"The cabin has large wraparound windows — almost 40% of fuselage length." },
    { title:"Conventional Tail", text:"H-stab at fuselage level, V-fin on top. (Not a T-tail.)" },
    { title:"Fixed Gear", text:"Fixed tricycle — wheel fairings (pants) cover the tires on most 172s." },
  ],
  steps: [
    {
      title: "Fuselage Body",
      fn: drawC172_fuselage,
      color: "#c62828",
      instructions: [
        "Draw the top profile: flat-ish from tail, rises gently into a large round cowling at the nose.",
        "Draw the bottom: nearly flat along the belly, curving up sharply into the cowling.",
        "The cowling is noticeably wider than the rest of the fuselage — like a fat drum at the front.",
        "The tail tapers to a blunt point where the stabilizers will attach."
      ],
      tip: "Whiteboard tip: Start with the belly line (almost straight), then add the cowling dome — students often forget how BIG the Cessna cowling is relative to the fuselage."
    },
    {
      title: "Cabin Windows",
      fn: drawC172_windows,
      color: "#1565c0",
      instructions: [
        "The Cessna 172 has a 'greenhouse' cabin — lots of glass from just behind the cowling to about 55% back.",
        "Draw the front windshield: a parallelogram slanting forward.",
        "Behind it, a large square side window with a door post dividing front and rear panes.",
        "The window sill runs along the fuselage and the roof line is the top of the fuselage."
      ],
      tip: "Whiteboard tip: Big windows = good visibility = student favorite. Draw an arrow labeling 'visibility advantage over low-wing aircraft' to spark discussion on traffic scanning."
    },
    {
      title: "High Wing + Struts",
      fn: drawC172_wing,
      color: "#2e7d32",
      instructions: [
        "The wing attaches to the TOP of the fuselage — from above the cabin rearward about 40% of fuselage length.",
        "Draw the wing extending up and slightly aft to a blunt tip. The leading edge has very little sweep.",
        "Add the lift strut: a diagonal brace from the lower fuselage up to the wing at about 55% of the span.",
        "This strut is load-bearing and one of the most distinctive visual features of the 172."
      ],
      tip: "Whiteboard tip: The strut is what students forget! Label it 'LIFT STRUT' and note it allows a lighter wing structure. Great intro to semi-cantilever vs. cantilever wing design."
    },
    {
      title: "Empennage (Tail)",
      fn: drawC172_tail,
      color: "#6a1b9a",
      instructions: [
        "At the tail: a vertical fin sweeps back and up — moderately tall, slightly swept leading edge.",
        "The horizontal stabilizer mounts at fuselage level (MID tail, not T-tail) — small swept surfaces on each side.",
        "The rear 40% of the V-fin is the rudder — optionally add a thin dividing line.",
        "The rear 30% of each H-stab is the elevator."
      ],
      tip: "Whiteboard tip: This is conventional tail configuration. Label RUDDER (yaw), ELEVATOR (pitch) — perfect for teaching the three axes. Draw curved arrows to show each axis of rotation."
    },
    {
      title: "Propeller & Cowling Detail",
      fn: drawC172_prop,
      color: "#e65100",
      instructions: [
        "Add the spinner: a small dome on the nose, centered on the cowling.",
        "The prop blades extend above and below the spinner — each blade is widest near the middle, tapering to a rounded tip.",
        "Add a thin ring where the cowling meets the fuselage (the cowling is removable for engine access).",
        "Optionally sketch the exhaust pipe exiting below the cowling on the right side."
      ],
      tip: "Whiteboard tip: A 172 has a fixed-pitch prop (C172R/S) or constant-speed (172RG). Draw an arrow to the prop and ask students: 'What controls RPM?' Good systems discussion starter."
    },
    {
      title: "Landing Gear & Final Details",
      fn: drawC172_gear,
      color: "#37474f",
      instructions: [
        "Main gear: two legs dropping nearly straight down from below the wing root. Each ends in a teardrop 'wheel pant' fairing with the tire showing at the bottom.",
        "Nose gear: a shorter leg forward of the cabin, also with a wheel pant.",
        "Add nav lights: red dot on the left wingtip, green on right, white at the tail.",
        "Optional: small antenna stub on top of the fuselage."
      ],
      tip: "Whiteboard tip: For gear-up emergency training, erase the gear legs and draw a flat belly. Students immediately visualize what they're trying to avoid. Works great for engine-out forced landing discussions."
    }
  ]
};

function drawC172_fuselage(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, cw*0.004);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.fillStyle = col === "#1a1a1a" ? "#f4f4f4" : col+"18";

  // Main fuselage shell
  ctx.beginPath();
  // Start at tail tip, trace top:
  ctx.moveTo(x(68),  y(218));
  ctx.bezierCurveTo(x(85),y(208), x(115),y(200), x(160),y(194));
  ctx.bezierCurveTo(x(210),y(188), x(260),y(184), x(310),y(182));
  // cabin top (flat area where wing sits)
  ctx.lineTo(x(490), y(179));
  // windshield slope up to cowling
  ctx.bezierCurveTo(x(515),y(179), x(530),y(183), x(545),y(192));
  // cowling top
  ctx.bezierCurveTo(x(562),y(204), x(574),y(218), x(576),y(232));
  // cowling bottom
  ctx.bezierCurveTo(x(574),y(248), x(562),y(260), x(545),y(268));
  // windshield bottom / cabin front
  ctx.bezierCurveTo(x(530),y(274), x(515),y(278), x(490),y(279));
  // belly line — nearly flat
  ctx.lineTo(x(170), y(278));
  // tail taper bottom
  ctx.bezierCurveTo(x(130),y(275), x(100),y(266), x(80),y(252));
  ctx.bezierCurveTo(x(70),y(242), x(66),y(230), x(68),y(218));
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function drawC172_windows(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, cw*0.003);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.fillStyle = "#b3d4f5";

  // Front windshield (slanted forward)
  ctx.beginPath();
  ctx.moveTo(x(490),y(179)); ctx.lineTo(x(538),y(196));
  ctx.lineTo(x(527),y(240)); ctx.lineTo(x(488),y(229)); ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Door window (large square pane)
  ctx.beginPath();
  ctx.moveTo(x(382),y(182)); ctx.lineTo(x(484),y(182));
  ctx.lineTo(x(484),y(232)); ctx.lineTo(x(382),y(234)); ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Rear side window
  ctx.beginPath();
  ctx.moveTo(x(310),y(184)); ctx.lineTo(x(375),y(182));
  ctx.lineTo(x(375),y(234)); ctx.lineTo(x(310),y(240)); ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Door post line (vertical divider)
  ctx.beginPath(); ctx.moveTo(x(382),y(182)); ctx.lineTo(x(382),y(234)); ctx.stroke();

  // Cabin sill line
  ctx.beginPath(); ctx.moveTo(x(310),y(240)); ctx.lineTo(x(488),y(232)); ctx.stroke();
}

function drawC172_wing(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, cw*0.004);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.fillStyle = col === "#1a1a1a" ? "#e8e8e8" : col+"20";

  // Wing (far side, slightly perspective)
  ctx.beginPath();
  ctx.moveTo(x(310),y(179)); // wing root front
  ctx.lineTo(x(490),y(179)); // wing root rear
  ctx.lineTo(x(430),y(88));  // far tip rear (trailing edge)
  ctx.lineTo(x(270),y(90));  // far tip front (leading edge)
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Wing tip edge
  ctx.beginPath();
  ctx.moveTo(x(270),y(90)); ctx.lineTo(x(430),y(88)); ctx.stroke();

  // Flap/aileron divider line on wing trailing edge
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(x(387),y(179)); ctx.lineTo(x(355),y(95)); ctx.stroke();
  ctx.setLineDash([]);

  // Wing strut — diagonal brace from lower fuselage to wing ~55% span
  ctx.lineWidth = Math.max(1.5, cw*0.003);
  ctx.beginPath();
  ctx.moveTo(x(440),y(278)); // lower fuselage attachment
  ctx.lineTo(x(353),y(181)); // wing underside attachment
  ctx.stroke();

  // Second strut (slight angle variation for depth)
  ctx.beginPath();
  ctx.moveTo(x(448),y(278));
  ctx.lineTo(x(362),y(181));
  ctx.stroke();
}

function drawC172_tail(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, cw*0.004);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.fillStyle = col === "#1a1a1a" ? "#e8e8e8" : col+"20";

  // Vertical fin
  ctx.beginPath();
  ctx.moveTo(x(68), y(218)); // tail top (fuselage)
  ctx.bezierCurveTo(x(72),y(196), x(82),y(165), x(100),y(138));
  ctx.bezierCurveTo(x(108),y(124), x(120),y(118), x(128),y(120));
  ctx.lineTo(x(136), y(152)); // rudder leading edge
  ctx.lineTo(x(125), y(218)); // back down to tail junction
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Rudder hinge line (dashed)
  ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(x(122),y(218)); ctx.lineTo(x(108),y(128)); ctx.stroke();
  ctx.setLineDash([]);

  // Horizontal stabilizer — far side (upper)
  ctx.beginPath();
  ctx.moveTo(x(68),y(218));
  ctx.lineTo(x(125),y(218));
  ctx.lineTo(x(115),y(192));
  ctx.lineTo(x(44), y(200));
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Horizontal stabilizer — near side (lower)
  ctx.beginPath();
  ctx.moveTo(x(68),y(235));
  ctx.lineTo(x(125),y(238));
  ctx.lineTo(x(115),y(262));
  ctx.lineTo(x(44), y(254));
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawC172_prop(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, cw*0.003);
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // Spinner dome
  ctx.fillStyle = col === "#1a1a1a" ? "#ccc" : col+"80";
  ctx.beginPath();

  ctx.moveTo(x(308),y(178)); ctx.lineTo(x(380),y(174));
  ctx.lineTo(x(378),y(232)); ctx.lineTo(x(308),y(240)); ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(x(380),y(174)); ctx.lineTo(x(380),y(234)); ctx.stroke();
}

function drawPA44_wing(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, cw*0.004);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.fillStyle = col === "#1a1a1a" ? "#e8e8e8" : col+"20";

  // Low wing — slightly longer span than the Cherokee
  ctx.beginPath();
  ctx.moveTo(x(330),y(290));
  ctx.lineTo(x(510),y(290));
  ctx.lineTo(x(548),y(276));
  ctx.lineTo(x(420),y(206));
  ctx.lineTo(x(268),y(216));
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Left engine nacelle (inner, 35% span)
  function nacelle(nx, ny, isLeft) {
    ctx.fillStyle = col === "#1a1a1a" ? "#ddd" : col+"30";
    ctx.beginPath();
    ctx.ellipse(x(nx), y(ny), x(46)-x(0), y(16)-y(0), isLeft ? -0.12 : -0.12, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    // intake ring
    ctx.beginPath();
    ctx.ellipse(x(nx+46), y(ny), x(11)-x(0), y(16)-y(0), 0, 0, Math.PI*2);
    ctx.stroke();
  }
  nacelle(348, 238, true);  // left engine (closer to root)
  nacelle(430, 222, false); // right engine (farther out)

  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(x(370),y(290)); ctx.lineTo(x(320),y(216)); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPA44_tail(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, cw*0.004);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.fillStyle = col === "#1a1a1a" ? "#e8e8e8" : col+"20";

  // Vertical fin — taller than Cherokee to carry T-tail weight
  ctx.beginPath();
  ctx.moveTo(x(68), y(220));
  ctx.bezierCurveTo(x(72),y(196), x(84),y(162), x(98),y(130));
  ctx.bezierCurveTo(x(106),y(110), x(118),y(100), x(126),y(100));
  ctx.bezierCurveTo(x(134),y(100), x(140),y(108), x(140),y(122));
  ctx.lineTo(x(132), y(220));
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(x(122),y(220)); ctx.lineTo(x(118),y(110)); ctx.stroke();
  ctx.setLineDash([]);

  // T-TAIL: H-stab at TOP of vertical fin
  // Far side
  ctx.beginPath();
  ctx.moveTo(x(100),y(100)); ctx.lineTo(x(138),y(100));
  ctx.lineTo(x(128),y(78));  ctx.lineTo(x(52), y(86));
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Near side
  ctx.beginPath();
  ctx.moveTo(x(100),y(112)); ctx.lineTo(x(138),y(112));
  ctx.lineTo(x(128),y(132)); ctx.lineTo(x(52), y(124));
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // T-junction cap line (top of V-fin below H-stab)
  ctx.lineWidth = Math.max(2, cw*0.005);
  ctx.beginPath(); ctx.moveTo(x(98),y(100)); ctx.lineTo(x(140),y(100)); ctx.stroke();

  // Label indicator mark for T-tail junction
  ctx.lineWidth = Math.max(1, cw*0.002);
  ctx.strokeStyle = col;
}

function drawPA44_props(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, cw*0.003);
  ctx.lineCap = "round";

  function prop(px, py, spinDir) {
    // spinner
    ctx.fillStyle = col === "#1a1a1a" ? "#bbb" : col+"80";
    ctx.beginPath(); ctx.ellipse(x(px),y(py), x(10)-x(0),y(14)-y(0),0,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    // blades
    ctx.fillStyle = col === "#1a1a1a" ? "#888" : col+"aa";
    const dir = spinDir === 1 ? 1 : -1;
    [-1,1].forEach(side => {
      ctx.beginPath();
      ctx.moveTo(x(px-2), y(py + side*14));
      ctx.bezierCurveTo(x(px-6),y(py + side*40), x(px-7),y(py + side*70), x(px-4),y(py + side*88));
      ctx.bezierCurveTo(x(px+2),y(py + side*94), x(px+8),y(py + side*88), x(px+8),y(py + side*78));
      ctx.bezierCurveTo(x(px+8),y(py + side*58), x(px+4),y(py + side*28), x(px+2),y(py + side*14));
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
  }
  prop(394, 238, 1);  // left engine — standard rotation
  prop(476, 222, -1); // right engine — counter-rotation
}

function drawPA44_gear(ctx, cw, ch, col) {
  const {x,y} = makeS(cw,ch);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, cw*0.0035);
  ctx.lineCap = "round";

  function wheel(cx2, top, cy2) {
    ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(x(cx2),y(top)); ctx.lineTo(x(cx2),y(cy2-10)); ctx.stroke();
    ctx.fillStyle = col === "#1a1a1a" ? "#ccc" : col+"33";
    ctx.beginPath(); ctx.ellipse(x(cx2),y(cy2), x(20)-x(0),y(13)-y(0),0,0,Math.PI*2);
    ctx.fill(); ctx.strokeStyle=col; ctx.stroke();
    ctx.strokeStyle = col === "#1a1a1a" ? "#555" : col;
    ctx.beginPath(); ctx.arc(x(cx2),y(cy2+4), x(12)-x(0),0.3,Math.PI-0.3); ctx.stroke();
  }
  wheel(360, 290, 336); wheel(418, 290, 336);
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.moveTo(x(340),y(336)); ctx.lineTo(x(438),y(336)); ctx.stroke();
  wheel(525, 284, 330);

  ctx.fillStyle="#ff2222"; ctx.beginPath(); ctx.arc(x(270),y(216),x(5)-x(0),0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#22cc44"; ctx.beginPath(); ctx.arc(x(422),y(207),x(5)-x(0),0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(x(68),y(230),x(4)-x(0),0,Math.PI*2); ctx.fill();
}

/* ═══════════════════════════════════════════════════
   PLANE REGISTRY & SHARED DRAWING ENGINE
═══════════════════════════════════════════════════ */
const PLANES = { c172: C172, pa28: PA28, pa44: PA44 };
let currentPlane = "c172";
let currentStep  = 0;
let animFrame    = null;

function drawUpToStep(ctx, cw, ch, plane, stepIdx, highlightLast) {
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cw, ch);
  plane.steps.forEach((step, i) => {
    if (i > stepIdx) return;
    const col = (highlightLast && i === stepIdx) ? step.color : "#1a1a1a";
    step.fn(ctx, cw, ch, col);
  });
}

function animateStep(canvas, plane, stepIdx) {
  if (animFrame) cancelAnimationFrame(animFrame);
  const ctx = canvas.getContext("2d");
  const cw = canvas.width, ch = canvas.height;

  ctx.clearRect(0,0,cw,ch); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cw,ch);
  for (let i = 0; i < stepIdx; i++) plane.steps[i].fn(ctx, cw, ch, "#1a1a1a");

  const off = document.createElement("canvas");
  off.width = cw; off.height = ch;
  const octx = off.getContext("2d");
  plane.steps[stepIdx].fn(octx, cw, ch, plane.steps[stepIdx].color);
  const imgData = octx.getImageData(0,0,cw,ch);

  let progress = 0; const totalFrames = 55;
  function tick() {
    progress++;
    const revealY = Math.floor(Math.min(progress/totalFrames,1)*ch);
    ctx.putImageData(imgData,0,0, 0,0, cw,revealY);
    if (progress < totalFrames) animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);
}

/* ── Tutorial UI ── */
const tutCanvas = document.getElementById("tutorial-canvas");

function buildDots() {
  const plane = PLANES[currentPlane];
  const c = document.getElementById("step-dots"); c.innerHTML="";
  plane.steps.forEach((_,i)=>{
    const d=document.createElement("div");
    d.className="dot"+(i<currentStep?" done":i===currentStep?" active":"");
    d.addEventListener("click",()=>goToStep(i));
    c.appendChild(d);
  });
}

function goToStep(idx) {
  const plane = PLANES[currentPlane];
  currentStep = idx;
  document.getElementById("step-badge").textContent=`Step ${idx+1} of ${plane.steps.length}`;
  document.getElementById("step-title").textContent=plane.steps[idx].title;
  document.getElementById("prev-btn").disabled = idx===0;
  document.getElementById("next-btn").textContent = idx===plane.steps.length-1 ? "Finish ✓" : "Next →";
  document.getElementById("next-btn").disabled = false;
  buildDots();
  const list = document.getElementById("instruction-list");
  list.innerHTML = plane.steps[idx].instructions.map((t,i)=>`<li data-num="${i+1}">${t}</li>`).join("");
  const tip = plane.steps[idx].tip;
  document.getElementById("whiteboard-tip").innerHTML=`<strong>&#9998; ${tip.split(":")[0]}:</strong>${tip.split(":").slice(1).join(":")}`;
  animateStep(tutCanvas, plane, idx);
}

document.getElementById("prev-btn").addEventListener("click",()=>{ if(currentStep>0) goToStep(currentStep-1); });
document.getElementById("next-btn").addEventListener("click",()=>{ const p=PLANES[currentPlane]; if(currentStep<p.steps.length-1) goToStep(currentStep+1); });
document.getElementById("replay-btn").addEventListener("click",()=>animateStep(tutCanvas,PLANES[currentPlane],currentStep));

/* ── Plane selector ── */
document.querySelectorAll(".plane-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".plane-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentPlane = btn.dataset.plane;
    currentStep = 0;
    goToStep(0);
    updatePracticeGhost();
    buildRefGrid();
    buildPracticeHints();
  });
});

/* ── Practice board ── */
const practiceCanvas = document.getElementById("practice-canvas");
const ghostCanvas    = document.getElementById("ghost-canvas");
const pCtx = practiceCanvas.getContext("2d");
const gCtx = ghostCanvas.getContext("2d");

function updatePracticeGhost() {
  const plane = PLANES[currentPlane];
  drawUpToStep(gCtx, ghostCanvas.width, ghostCanvas.height, plane, plane.steps.length-1, false);
}

pCtx.fillStyle="#fff"; pCtx.fillRect(0,0,practiceCanvas.width,practiceCanvas.height);
updatePracticeGhost();

let isDrawing=false, tool="pen", brushColor="#1a1a1a", brushSize=3, lastX=0, lastY=0;

function getPos(e, canvas){
  const r=canvas.getBoundingClientRect(), sx=canvas.width/r.width, sy=canvas.height/r.height;
  const s=e.touches?e.touches[0]:e;
  return [(s.clientX-r.left)*sx, (s.clientY-r.top)*sy];
}
function startDraw(e){ isDrawing=true; [lastX,lastY]=getPos(e,practiceCanvas);
  pCtx.beginPath(); pCtx.arc(lastX,lastY,(tool==="eraser"?brushSize*4:brushSize)/2,0,Math.PI*2);
  pCtx.fillStyle=tool==="eraser"?"#fff":brushColor; pCtx.fill(); }
function doDraw(e){ if(!isDrawing)return; e.preventDefault();
  const [cx,cy]=getPos(e,practiceCanvas);
  pCtx.beginPath(); pCtx.moveTo(lastX,lastY); pCtx.lineTo(cx,cy);
  pCtx.strokeStyle=tool==="eraser"?"#fff":brushColor;
  pCtx.lineWidth=tool==="eraser"?brushSize*4:brushSize;
  pCtx.lineCap="round"; pCtx.lineJoin="round"; pCtx.stroke();
  [lastX,lastY]=[cx,cy]; }
function endDraw(){ isDrawing=false; }

practiceCanvas.addEventListener("mousedown",startDraw);
practiceCanvas.addEventListener("mousemove",doDraw);
practiceCanvas.addEventListener("mouseup",endDraw);
practiceCanvas.addEventListener("mouseleave",endDraw);
practiceCanvas.addEventListener("touchstart",startDraw,{passive:false});
practiceCanvas.addEventListener("touchmove",doDraw,{passive:false});
practiceCanvas.addEventListener("touchend",endDraw);

document.getElementById("tool-pen").addEventListener("click",()=>{
  tool="pen"; document.getElementById("tool-pen").classList.add("active");
  document.getElementById("tool-eraser").classList.remove("active"); practiceCanvas.style.cursor="crosshair"; });
document.getElementById("tool-eraser").addEventListener("click",()=>{
  tool="eraser"; document.getElementById("tool-eraser").classList.add("active");
  document.getElementById("tool-pen").classList.remove("active"); practiceCanvas.style.cursor="cell"; });
document.getElementById("brush-size").addEventListener("input",e=>{ brushSize=parseInt(e.target.value); });
document.querySelectorAll(".color-swatch").forEach(sw=>{
  sw.addEventListener("click",()=>{
    document.querySelectorAll(".color-swatch").forEach(s=>s.classList.remove("active"));
    sw.classList.add("active"); brushColor=sw.dataset.color; tool="pen";
    document.getElementById("tool-pen").classList.add("active");
    document.getElementById("tool-eraser").classList.remove("active"); }); });

let ghostVisible=true;
document.getElementById("toggle-ghost").addEventListener("click",()=>{
  ghostVisible=!ghostVisible; ghostCanvas.style.opacity=ghostVisible?"0.15":"0";
  document.getElementById("toggle-ghost").classList.toggle("active",ghostVisible); });
document.getElementById("clear-canvas").addEventListener("click",()=>{
  pCtx.fillStyle="#fff"; pCtx.fillRect(0,0,practiceCanvas.width,practiceCanvas.height); });

function buildPracticeHints() {
  const h=document.getElementById("practice-hints"); h.innerHTML="";
  PLANES[currentPlane].hints.forEach(hint=>{
    const d=document.createElement("div"); d.className="hint-card";
    d.innerHTML=`<strong>${hint.title}</strong>${hint.text}`; h.appendChild(d); });
}

/* ── Reference grid ── */
function buildRefGrid() {
  const grid=document.getElementById("ref-grid"); grid.innerHTML="";
  const plane=PLANES[currentPlane];
  plane.steps.forEach((step,i)=>{
    const card=document.createElement("div"); card.className="ref-card";
    const cv=document.createElement("canvas"); cv.width=400; cv.height=250;
    card.appendChild(cv);
    const lbl=document.createElement("div"); lbl.className="ref-label"; lbl.textContent=`${i+1}. ${step.title}`; card.appendChild(lbl);
    const desc=document.createElement("div"); desc.className="ref-desc";
    desc.textContent=step.instructions[0]; card.appendChild(desc);
    grid.appendChild(card);
    drawUpToStep(cv.getContext("2d"),400,250,plane,i,true);
  });
}

/* ── Tab switching ── */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-"+btn.dataset.tab).classList.add("active"); }); });

/* ── Init ── */
goToStep(0);
buildPracticeHints();
buildRefGrid();
</script>
